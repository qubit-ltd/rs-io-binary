[package]
name = "qubit-io-binary-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "^0.4"
qubit-codec = { path = "../../rs-codec", version = "0.17", features = ["io"] }

qubit-codec-binary = { path = "../../rs-codec-binary", version = "0.9" }

qubit-io = "0.19.1"

qubit-io-binary = { path = ".." }

[[bin]]
name = "stream_differential"
path = "fuzz_targets/stream_differential.rs"
test = false
doc = false
bench = false

[workspace]

[[bin]]
name = "async_differential"
path = "fuzz_targets/async_differential.rs"
test = false
doc = false
bench = false
