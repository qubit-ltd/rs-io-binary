name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-ci:
    permissions:
      contents: read
      pull-requests: write
      pages: write
      id-token: write
    uses: qubit-ltd/rs-infra-ci/.github/workflows/github-ci.yml@main

  prepare-feature-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate and generate feature matrix
        id: matrix
        run: |
          set -euo pipefail
          config=.infra/ci/cargo-matrix.json
          jq -e '
            .version == 1
            and (.checks | type == "array" and length > 0)
            and all(.checks[];
              (.name | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]*$"))
              and (.commands | type == "array" and length > 0)
              and ((.packages // []) | type == "array" and all(.[]; type == "string" and test("^[A-Za-z0-9][A-Za-z0-9_-]*$")))
              and ((.packages // []) | length == (unique | length))
              and ((has("packages") | not) or (.packages | length > 0))
              and ((if has("defaultFeatures") then .defaultFeatures else true end) | type == "boolean")
              and ((if has("allFeatures") then .allFeatures else false end) | type == "boolean")
              and ((if has("allFeatures") then .allFeatures else false end) == false or ((.features // []) | length == 0) and ((if has("defaultFeatures") then .defaultFeatures else true end) == true))
              and ((.features // []) | type == "array" and all(.[]; type == "string"))
            )
          ' "$config" > /dev/null
          matrix=$(jq -c '{include: [.checks[] | {
            name,
            commands: (.commands | join(",")),
            default_features: (if has("defaultFeatures") then .defaultFeatures else true end),
            all_features: (if has("allFeatures") then .allFeatures else false end),
            features: ((.features // []) | join(",")),
            packages: ((.packages // []) | join(","))
          }]}' "$config")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  length-conversion-i686:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rs-io-binary
    env:
      CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER: gcc
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: rs-io-binary
      - name: Install 32-bit Rust and system linker support
        run: |
          rustup toolchain install 1.94.0 --profile minimal --target i686-unknown-linux-gnu
          sudo apt-get update
          sudo apt-get install -y gcc-multilib
      - name: Prepare local path dependencies
        run: ./.infra/bin/prepare-local-path-dependencies.sh
      - name: Execute length conversion tests on i686
        run: cargo +1.94.0 test --locked --target i686-unknown-linux-gnu --test length_conversion_tests -- --nocapture
