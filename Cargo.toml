[package]
name = "qubit-io-binary"
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-io-binary"
description = "Synchronous and asynchronous binary stream I/O adapters for Rust"
homepage = "https://github.com/qubit-ltd/rs-io-binary"
documentation = "https://docs.rs/qubit-io-binary"
readme = "README.md"
keywords = ["io", "binary", "leb128", "zigzag", "qubit"]
categories = ["encoding", "rust-patterns"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/RUST_CODING_STYLE.md",
    "/RUST_CODING_STYLE.zh_CN.md",
 "/doc/**/user_guide*.md",
 "/benches/**",
    "/examples/**",
    "/resources/**",
    "/src/**",
    "/tests/**",
]

[lib]
name = "qubit_io_binary"
doctest = true

[package.metadata.rs-ci]
miri = true
sanitizers = ["address"]

[dependencies]
qubit-io = "0.14"
qubit-codec = { version = "0.11", features = ["io"] }
qubit-codec-binary = "0.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(miri)'] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
qubit-codec = { version = "0.11", features = ["io"] }
tempfile = "3.27"

[[bench]]
name = "stream"
harness = false
